  services:
    headless:
      build:
        context: .
        dockerfile: Dockerfile.headless
        network: host          # Use host network during build
      network_mode: host       # Use host network at runtime
      stdin_open: true         # Keep stdin open even if not attached
      tty: true                # Allocate a pseudo-TTY
      ports:
        - 5000:5000

